<!doctype html>

<head>

<body>
  <a class="skip" href="#content">Ir para o conteúdo</a>
  <aside class="sidebar" aria-label="Menu principal">
    <a href="#dashboard" class="brand" aria-label="Lili Papelaria, início"><span class="brand-word">lili<span>.</span></span><span class="brand-sub">PAPELARIA</span></a>
    <span class="nav-label">MEU NEGÓCIO</span>
